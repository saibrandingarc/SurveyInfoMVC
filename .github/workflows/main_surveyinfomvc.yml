# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - SurveyInfoMVC

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: cmpbrandingarc.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_E365AAE09BBC478DB7ED4F4C9F930F7C }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_1784BE8C5E404B05915291FEA16B0BC6 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: cmpbrandingarc.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_E365AAE09BBC478DB7ED4F4C9F930F7C }}/surveyinfomvc:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'SurveyInfoMVC'
          slot-name: 'Production'
          images: 'cmpbrandingarc.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_E365AAE09BBC478DB7ED4F4C9F930F7C }}/surveyinfomvc:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_4C0E63D63CF74D649BB3410EEAD607C0 }}